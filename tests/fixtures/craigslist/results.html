<!doctype html>
<html><body>
<!-- Craigslist gallery results as seen LIVE 2026-07-24 (philadelphia, "standing desk").
     Corrects the pre-live best-guess this fixture used to encode. Three real differences:
       1. the card is a DIV, not an LI (`li.cl-search-result` matched 0 of 24 live);
       2. post URLs are /view/d/<slug>/<token> — no <pid>.html tail any more;
       3. the gallery swipe dots put a run of bare bullets at the head of innerText.
     A legacy static-fallback card is kept too — craigslist still serves that shape to
     some clients, and dropping support for it would be a silent narrowing. -->
<div class="cl-search-results-container">
  <div class="results cl-search-results-pageless cl-wide cl-search-view-mode-gallery">

    <div data-pid="7943875578" class="cl-search-result cl-search-view-mode-gallery" title="Lots of Free Items in Bryn Mawr">
      <div class="gallery-card">
        <div class="cl-gallery"><div class="gallery-inner">
          <a class="main" href="https://www.craigslist.org/view/d/bryn-mawr-lots-of-free-items-in-bryn/2ufy5AoBB39XSutMzkHfvj">
            <img alt="Lots of Free Items in Bryn Mawr 1" src="https://images.craigslist.org/d/7943875578/00404.jpg">
          </a>
          <div class="dots"><span>&bull;</span><span>&bull;</span><span>&bull;</span></div>
        </div></div>
        <a class="cl-app-anchor cl-search-anchor text-only posting-title"
           href="https://www.craigslist.org/view/d/bryn-mawr-lots-of-free-items-in-bryn/2ufy5AoBB39XSutMzkHfvj">
          <span class="label">Lots of Free Items in Bryn Mawr</span></a>
        <div class="meta">6/28<span class="separator"></span>Bryn Mawr</div>
        <span class="priceinfo">free</span>
      </div>
    </div>

    <div data-pid="7943875579" class="cl-search-result cl-search-view-mode-gallery" title="UPLIFT Standing Desk">
      <div class="gallery-card">
        <div class="cl-gallery"><div class="gallery-inner">
          <a class="main" href="https://www.craigslist.org/view/d/broomall-new-uplift-standing-desk/8EhtzWDrDcXbcQiWBpsYRA">
            <img alt="UPLIFT Standing Desk 1" src="https://images.craigslist.org/d/7943875579/00404.jpg">
          </a>
          <div class="dots"><span>&bull;</span><span>&bull;</span></div>
        </div></div>
        <a class="cl-app-anchor cl-search-anchor text-only posting-title"
           href="https://www.craigslist.org/view/d/broomall-new-uplift-standing-desk/8EhtzWDrDcXbcQiWBpsYRA">
          <span class="label">NEW - UPLIFT Standing Desk V2</span></a>
        <div class="meta">6/29<span class="separator"></span>Broomall</div>
        <span class="priceinfo">$280</span>
      </div>
    </div>

    <!-- Legacy static-fallback shape: an LI with a classic <pid>.html permalink. -->
    <li class="cl-static-search-result" title="Jarvis Bamboo Standing Desk">
      <a class="posting-title" href="https://philadelphia.craigslist.org/fur/d/philadelphia-jarvis-bamboo-desk/7943875580.html">
        <span class="label">Jarvis Bamboo Standing Desk</span></a>
      <div class="meta">6/30<span class="separator"></span>Fishtown</div>
      <span class="priceinfo">$150</span>
    </li>

    <!-- Chrome: no posting link at all. Must be dropped, not extracted. -->
    <div class="cl-search-result cl-search-view-mode-gallery">
      <div class="gallery-card">
        <span class="label">Sponsored placeholder (no link)</span>
        <span class="priceinfo">$99</span>
      </div>
    </div>

  </div>
</div>
</body></html>
